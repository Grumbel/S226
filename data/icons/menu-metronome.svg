<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="wood" x1="12" y1="6" x2="12" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5a50a"/>
      <stop offset="0.45" stop-color="#c64600"/>
      <stop offset="1" stop-color="#5c1a00"/>
    </linearGradient>
    <linearGradient id="woodSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f06b"/>
      <stop offset="0.5" stop-color="#e5a50a"/>
      <stop offset="1" stop-color="#865e00"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="0.5" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
  </defs>
  <!-- base shadow -->
  <ellipse cx="24" cy="43" rx="14" ry="3" fill="#000" opacity="0.25"/>
  <!-- pyramid body shadow -->
  <path d="M10 40 L24 6 L38 40 Z" fill="#3d2008" transform="translate(0 1.5)" opacity="0.4"/>
  <!-- body -->
  <path d="M10 40 L24 6 L38 40 Z" fill="url(#wood)" stroke="#4a1a00" stroke-width="1"/>
  <path d="M10 40 L24 6 L38 40 Z" fill="url(#woodSide)"/>
  <!-- scale marks -->
  <path d="M20 34h8M19 28h10M18.5 22h11" stroke="#f6d32d" stroke-width="1" opacity="0.55"/>
  <!-- pendulum rod -->
  <path d="M24 10 L34 28" stroke="url(#rod)" stroke-width="2.4" stroke-linecap="round"/>
  <!-- weight -->
  <rect x="31" y="24" width="8" height="6" rx="1.2" fill="url(#brass)" stroke="#5c4000" stroke-width="0.8"
        transform="rotate(35 35 27)"/>
  <!-- pivot -->
  <circle cx="24" cy="10" r="2.2" fill="url(#brass)" stroke="#5c4000" stroke-width="0.7"/>
  <!-- base plate -->
  <path d="M11 40h26v3H11z" fill="#5c1a00" stroke="#3d1000" stroke-width="0.8"/>
  <path d="M11 40h26" stroke="#e5a50a" stroke-width="0.8" opacity="0.4"/>
</svg>
