<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="cuff" x1="4" y1="10" x2="4" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c8ebf"/>
      <stop offset="1" stop-color="#1c3d6e"/>
    </linearGradient>
    <linearGradient id="gauge" x1="28" y1="8" x2="28" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="0.5" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#5e5c64"/>
    </linearGradient>
    <radialGradient id="glass" cx="34" cy="16" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- cuff shadow -->
  <rect x="5" y="14" width="20" height="22" rx="4" fill="#0b1e36" opacity="0.35"/>
  <!-- cuff body -->
  <rect x="4" y="12" width="20" height="22" rx="4" fill="url(#cuff)" stroke="#122b4a" stroke-width="1"/>
  <!-- cuff bands -->
  <path d="M6 18h16M6 24h16M6 30h16" stroke="#0d2240" stroke-width="1.5" opacity="0.35"/>
  <!-- tube -->
  <path d="M24 22h6" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <!-- gauge body shadow -->
  <circle cx="36" cy="23" r="11" fill="#3d3846" opacity="0.35" transform="translate(0 1.5)"/>
  <!-- gauge face -->
  <circle cx="36" cy="22" r="11" fill="url(#gauge)" stroke="#5e5c64" stroke-width="1.5"/>
  <!-- ticks -->
  <path d="M36 13v2.5M36 28.5V31M27 22h2.5M42.5 22H45" stroke="#3d3846" stroke-width="1.2" stroke-linecap="round"/>
  <!-- needle -->
  <path d="M36 22 L42 15" stroke="#c01c28" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="36" cy="22" r="2.2" fill="#c01c28" stroke="#5c1018" stroke-width="0.6"/>
  <!-- glass shine -->
  <circle cx="36" cy="22" r="11" fill="url(#glass)"/>
</svg>
