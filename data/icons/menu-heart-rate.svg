    <path id="heart" d="M24 42C14 34.5 4 26.5 4 16.5 4 10.5 8.8 6 14.5 6c4 0 7 2.2 9.5 5.5C26.5 8.2 29.5 6 33.5 6 39.2 6 44 10.5 44 16.5 44 26.5 34 34.5 24 42z"/>
